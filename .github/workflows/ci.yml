name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Test (pytest, excluding live tests)
        run: pytest tests/ --ignore=tests/test_live_collect.py -v --tb=short

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # Reciprocal guard: enforce that at least one real test file exists.
      # --passWithNoTests silently passes with zero coverage — this prevents that.
      - name: Guard — require at least one test file
        run: |
          count=$(find src -name '*.test.*' -o -name '*.spec.*' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No test files found in frontend/src/ (*.test.* or *.spec.*)"
            echo "Add at least one real test — do not use --passWithNoTests to dodge this."
            exit 1
          fi
          echo "Found $count test file(s). Proceeding."

      - name: Test (vitest)
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend + pip-audit
        run: |
          pip install pip-audit
          pip install -e "backend[dev]"

      - name: Audit Python dependencies
        run: pip-audit --desc

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # --omit=dev audits only production (shipped) dependencies.
      # The remaining HIGH/CRITICAL advisories (GHSA-67mh-4wv8-2f99 via esbuild ≤0.24.2)
      # are in the vite/vite-node/vitest dev tooling chain and do NOT ship to users.
      # Fixing them requires vite@8 (major breaking change). Tracked separately.
      # Production deps are clean at --audit-level=high.
      - name: Audit npm dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high
